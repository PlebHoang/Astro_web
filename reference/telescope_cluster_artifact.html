<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telescope Sky View — Andromeda & The Big Dipper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000000;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #sky-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      z-index: 1;
    }
    #sky-canvas:active {
      cursor: grabbing;
    }

    /* Telescope Eyepiece Reticle & Circular Aperture */
    .eyepiece-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      box-shadow: inset 0 0 120px 60px rgba(0, 0, 0, 0.95);
      transition: opacity 0.4s ease;
    }
    .eyepiece-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vh, 80vw);
      height: min(80vh, 80vw);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.55), inset 0 0 40px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 3;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .eyepiece-reticle.reticle-off {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.15);
    }
    .reticle-crosshair {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reticle-crosshair::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 5%, rgba(255,255,255,0.15) 35%, transparent 48%, transparent 52%, rgba(255,255,255,0.15) 65%, transparent 95%);
    }
    .reticle-crosshair::after {
      content: "";
      position: absolute;
      height: 100%;
      width: 1px;
      background: linear-gradient(180deg, transparent 5%, rgba(255,255,255,0.15) 35%, transparent 48%, transparent 52%, rgba(255,255,255,0.15) 65%, transparent 95%);
    }
    .reticle-ring-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 25%;
      height: 25%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.18);
    }

    /* UI Chrome */
    .ui-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 30px;
    }
    .interactive {
      pointer-events: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
    .brand-sub {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .control-deck {
      background: rgba(6, 7, 12, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
    }
    .btn {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }
    .btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    .bottom-hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .hud-card {
      background: rgba(6, 7, 12, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(16px);
      padding: 10px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .hud-card strong {
      color: #f8fafc;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
    }
    .speed-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffffff;
    }
    .speed-bar {
      width: 60px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .speed-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 20%;
      background: #ffffff;
      transition: width 0.1s ease;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Telescope Canvas -->
  <canvas id="sky-canvas"></canvas>

  <!-- Circular Eyepiece Reticle -->
  <div class="eyepiece-overlay"></div>
  <div class="eyepiece-reticle" id="reticle">
    <div class="reticle-crosshair"></div>
    <div class="reticle-ring-inner"></div>
    <span style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-family: 'Space Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 1px;">N 000°</span>
    <span style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-family: 'Space Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 1px;">S 180°</span>
    <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: 'Space Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 1px;">E 090°</span>
    <span style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-family: 'Space Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 1px;">W 270°</span>
  </div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand-block">
        <div style="width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.25); border-radius: 9px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.04);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">C>U ASTRO SOC</div>
          <div class="brand-sub">Telescope Sky Observatory</div>
        </div>
      </div>

      <!-- Target Selection Deck -->
      <div class="control-deck interactive">
        <button class="btn active" id="btn-target-dipper">
          <span>✨ Big Dipper</span>
        </button>
        <button class="btn" id="btn-target-andromeda">
          <span>🌀 Andromeda M31</span>
        </button>
        <button class="btn" id="btn-target-warp">
          <span>🚀 Hyperspace</span>
        </button>
        <button class="btn" id="btn-toggle-reticle">
          <span id="reticle-label">🔭 Reticle: On</span>
        </button>
        <button class="btn" id="btn-zoom-level">
          <span id="zoom-label">🔍 20x Finder</span>
        </button>
      </div>
    </div>

    <!-- Bottom HUD -->
    <div class="bottom-hud">
      <div class="hud-card interactive">
        <span>STAR WARS TRAVEL WARP</span>
        <div class="speed-indicator">
          <span style="font-size: 10px;">SCROLL TO ACCELERATE</span>
          <div class="speed-bar"><div class="speed-fill" id="speed-fill"></div></div>
          <span id="speed-label" style="font-size: 10px; font-weight: bold;">0.2c</span>
        </div>
        <span style="color: #64748b; font-size: 9px; margin-top: 2px;">Drag canvas to orbit in 3D • Scroll wheel to warp through stars</span>
      </div>

      <div class="hud-card interactive" style="text-align: right;">
        <span id="target-header">TARGET: URSA MAJOR (BIG DIPPER)</span>
        <strong id="target-coords">RA 11h 03m / DEC +55°11' • MAG 1.8</strong>
        <span style="color: #cbd5e1; font-size: 9px; margin-top: 2px;">Pointer stars Merak & Dubhe lead to Polaris</span>
      </div>
    </div>
  </div>

  <script>
    // --- Canvas & Core Setup (Ponytail Minimalist Architecture) ---
    const canvas = document.getElementById("sky-canvas");
    const ctx = canvas.getContext("2d");
    const reticle = document.getElementById("reticle");
    const reticleLabel = document.getElementById("reticle-label");
    const zoomLabel = document.getElementById("zoom-label");
    const speedFill = document.getElementById("speed-fill");
    const speedLabel = document.getElementById("speed-label");
    const targetHeader = document.getElementById("target-header");
    const targetCoords = document.getElementById("target-coords");

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // --- State Variables ---
    let currentTarget = "dipper"; // "dipper" | "andromeda" | "warp"
    let isReticleOn = true;
    let zoomLevel = 1; // 1 = 20x Wide Finder, 2.5 = High Magnification Eyepiece
    let targetZoom = 1;

    // Camera & 3D Celestial Orientation
    let camYaw = 0;
    let camPitch = 0;
    let targetYaw = 0;
    let targetPitch = 0;
    let warpSpeed = 1.2; // Base forward speed
    let targetWarpSpeed = 1.2;
    let scrollBoost = 0;

    // --- Starfield System (Traveling in Star Wars hyperspace) ---
    const starCount = 1200;
    const stars = [];
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: (Math.random() - 0.5) * 2000,
        y: (Math.random() - 0.5) * 2000,
        z: Math.random() * 2000 + 50,
        pz: 0,
        size: Math.random() * 1.6 + 0.6,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    // --- TARGET 1: The Big Dipper (Ursa Major) from reference.jpg ---
    // Accurate 7 stars of Ursa Major + Polaris pointer
    const dipperStars = [
      { name: "Alkaid", x: 180, y: -150, z: 900, size: 3.5, label: "η UMa" },
      { name: "Mizar",  x: 100, y: -100, z: 900, size: 3.8, label: "ζ UMa (Double)" },
      { name: "Alioth", x: 60,  y: -40,  z: 900, size: 3.6, label: "ε UMa" },
      { name: "Megrez", x: 10,  y: 40,   z: 900, size: 3.0, label: "δ UMa" },
      { name: "Dubhe",  x: -60, y: 30,   z: 900, size: 4.2, label: "α UMa (Pointer)" },
      { name: "Merak",  x: -70, y: 120,  z: 900, size: 4.0, label: "β UMa (Pointer)" },
      { name: "Phecda", x: 0,   y: 130,  z: 900, size: 3.4, label: "γ UMa" },
      // Polaris (North Star)
      { name: "Polaris", x: -70, y: -260, z: 900, size: 4.6, label: "North Star α UMi" }
    ];

    const dipperLines = [
      [0, 1], [1, 2], [2, 3], // Handle
      [3, 4], [4, 5], [5, 6], [6, 3], // Bowl
      [5, 4], [4, 7] // Pointer line through Dubhe to Polaris!
    ];

    // --- TARGET 2: Andromeda Galaxy (M31) Spiral Particle System ---
    const andromedaParticleCount = 1400;
    const andromedaStars = [];
    const galaxyTilt = 38 * (Math.PI / 180); // Tilted ellipse angle

    for (let i = 0; i < andromedaParticleCount; i++) {
      // Logarithmic spiral distribution
      const arm = i % 2 === 0 ? 0 : Math.PI;
      const dist = Math.pow(Math.random(), 2.2) * 260 + 6;
      const angle = dist * 0.035 + arm + (Math.random() - 0.5) * 0.45;
      
      // Elliptical planar coordinates
      const gx = Math.cos(angle) * dist * 1.8;
      const gy = Math.sin(angle) * dist * 0.65; // compressed for tilt
      const gz = (Math.random() - 0.5) * (30 - dist * 0.08); // bulge thickness

      // Rotate ellipse by galaxyTilt
      const rx = gx * Math.cos(galaxyTilt) - gy * Math.sin(galaxyTilt);
      const ry = gx * Math.sin(galaxyTilt) + gy * Math.cos(galaxyTilt);

      // Core density luminescence
      const isCore = dist < 45;
      andromedaStars.push({
        x: rx - 600, // Located at an offset angle in sky
        y: ry - 80,
        z: 900 + gz,
        dist: dist,
        isCore: isCore,
        alpha: isCore ? Math.random() * 0.7 + 0.3 : Math.random() * 0.4 + 0.1,
        size: isCore ? Math.random() * 2.2 + 1.2 : Math.random() * 1.4 + 0.6
      });
    }

    // --- Target Presets & Switching ---
    function setTarget(t) {
      currentTarget = t;
      document.querySelectorAll(".control-deck .btn").forEach(b => b.classList.remove("active"));

      if (t === "dipper") {
        document.getElementById("btn-target-dipper").classList.add("active");
        targetYaw = 0;
        targetPitch = 0;
        targetWarpSpeed = 1.0;
        targetHeader.textContent = "TARGET: URSA MAJOR (BIG DIPPER)";
        targetCoords.textContent = "RA 11h 03m / DEC +55°11' • MAG 1.8";
      } else if (t === "andromeda") {
        document.getElementById("btn-target-andromeda").classList.add("active");
        targetYaw = 0.65; // Pan to Andromeda
        targetPitch = 0.1;
        targetWarpSpeed = 1.2;
        targetHeader.textContent = "TARGET: MESSIER 31 (ANDROMEDA GALAXY)";
        targetCoords.textContent = "RA 00h 42m / DEC +41°16' • 2.537 Mly DISTANCE";
      } else if (t === "warp") {
        document.getElementById("btn-target-warp").classList.add("active");
        targetWarpSpeed = 18.0; // Hyperdrive warp speed!
        targetHeader.textContent = "PROPULSION: HYPERSPACE WARP TUNNEL";
        targetCoords.textContent = "VELOCITY: 0.99c • STAR WARS TRAVEL ENGAGED";
      }
    }

    document.getElementById("btn-target-dipper").addEventListener("click", () => setTarget("dipper"));
    document.getElementById("btn-target-andromeda").addEventListener("click", () => setTarget("andromeda"));
    document.getElementById("btn-target-warp").addEventListener("click", () => setTarget("warp"));

    // Toggle Reticle
    document.getElementById("btn-toggle-reticle").addEventListener("click", () => {
      isReticleOn = !isReticleOn;
      if (isReticleOn) {
        reticle.classList.remove("reticle-off");
        reticleLabel.textContent = "🔭 Reticle: On";
      } else {
        reticle.classList.add("reticle-off");
        reticleLabel.textContent = "🔭 Reticle: Off";
      }
    });

    // Toggle Zoom (20x Finder vs High Power Eyepiece)
    document.getElementById("btn-zoom-level").addEventListener("click", () => {
      if (targetZoom === 1) {
        targetZoom = 2.4;
        zoomLabel.textContent = "🔍 80x Scope";
      } else {
        targetZoom = 1;
        zoomLabel.textContent = "🔍 20x Finder";
      }
    });

    // --- Scroll & Wheel Interaction (Star Wars Warp Speed) ---
    window.addEventListener("wheel", (e) => {
      scrollBoost += Math.abs(e.deltaY) * 0.025;
      if (e.deltaY < 0) {
        // Zoom forward
        targetZoom = Math.min(3.2, targetZoom + 0.15);
      } else {
        targetZoom = Math.max(0.7, targetZoom - 0.15);
      }
    }, { passive: true });

    // Page Scroll Boost
    window.addEventListener("scroll", () => {
      scrollBoost += 1.5;
    }, { passive: true });

    // --- Drag to Orbit & Pan Camera ---
    let isDragging = false;
    let prevX = 0;
    let prevY = 0;

    canvas.addEventListener("mousedown", (e) => {
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
    });
    window.addEventListener("mouseup", () => isDragging = false);
    window.addEventListener("mousemove", (e) => {
      if (isDragging) {
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        targetYaw -= dx * 0.0035;
        targetPitch -= dy * 0.0035;
        prevX = e.clientX;
        prevY = e.clientY;
      }
    });

    // Touch Support
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length > 0) {
        isDragging = true;
        prevX = e.touches[0].clientX;
        prevY = e.touches[0].clientY;
      }
    });
    window.addEventListener("touchend", () => isDragging = false);
    canvas.addEventListener("touchmove", (e) => {
      if (isDragging && e.touches.length > 0) {
        const dx = e.touches[0].clientX - prevX;
        const dy = e.touches[0].clientY - prevY;
        targetYaw -= dx * 0.005;
        targetPitch -= dy * 0.005;
        prevX = e.touches[0].clientX;
        prevY = e.touches[0].clientY;
      }
    });

    // --- 3D Perspective Projection Function ---
    function project(x, y, z, cx, cy) {
      // Camera Yaw (Y-axis)
      const cosY = Math.cos(camYaw);
      const sinY = Math.sin(camYaw);
      const x1 = x * cosY + z * sinY;
      const z1 = -x * sinY + z * cosY;

      // Camera Pitch (X-axis)
      const cosP = Math.cos(camPitch);
      const sinP = Math.sin(camPitch);
      const y2 = y * cosP - z1 * sinP;
      const z2 = y * sinP + z1 * cosP;

      const fov = 650 * zoomLevel;
      const depth = z2;

      if (depth <= 10) return null;
      const scale = fov / depth;

      return {
        sx: cx + x1 * scale,
        sy: cy + y2 * scale,
        scale: scale,
        depth: depth
      };
    }

    // Helper to draw 5-pointed stars
    function drawStar(ctx, cx, cy, spikes, rOut, rIn, style) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - rOut);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * rOut;
        y = cy + Math.sin(rot) * rOut;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * rIn;
        y = cy + Math.sin(rot) * rIn;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - rOut);
      ctx.closePath();
      ctx.fillStyle = style;
      ctx.fill();
    }

    // --- Main Render Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera interpolation
      camYaw += (targetYaw - camYaw) * 0.08;
      camPitch += (targetPitch - camPitch) * 0.08;
      zoomLevel += (targetZoom - zoomLevel) * 0.08;

      // Warp speed physics (Star Wars acceleration on scroll/button)
      scrollBoost *= 0.92; // decay scroll boost
      warpSpeed += (targetWarpSpeed + scrollBoost - warpSpeed) * 0.08;

      // Update HUD speed readout
      const speedNorm = Math.min(1, warpSpeed / 20);
      speedFill.style.width = `${Math.round(speedNorm * 100)}%`;
      speedLabel.textContent = `${(warpSpeed * 0.15).toFixed(2)}c`;

      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      const cx = width * 0.5;
      const cy = height * 0.5;

      // 1. Render Traveling Starfield (Star Wars Hyperspace motion trails)
      const isHyperdrive = warpSpeed > 3.0;

      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.pz = s.z; // Previous z for streak trails
        s.z -= warpSpeed * 3.5;

        // Recycle star when it passes camera
        if (s.z <= 20) {
          s.z = 2000;
          s.pz = 2000;
          s.x = (Math.random() - 0.5) * 2000;
          s.y = (Math.random() - 0.5) * 2000;
        }

        const curr = project(s.x, s.y, s.z, cx, cy);
        if (!curr) continue;

        if (isHyperdrive) {
          // Motion trail streak towards viewer
          const prev = project(s.x, s.y, s.pz, cx, cy);
          if (prev) {
            ctx.beginPath();
            ctx.moveTo(prev.sx, prev.sy);
            ctx.lineTo(curr.sx, curr.sy);
            ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, s.alpha * (warpSpeed / 12))})`;
            ctx.lineWidth = Math.max(1, s.size * curr.scale * 0.8);
            ctx.stroke();
          }
        } else {
          // Sharp point star with subtle glow
          ctx.beginPath();
          ctx.arc(curr.sx, curr.sy, Math.max(0.6, s.size * curr.scale), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
          ctx.fill();
        }
      }

      // 2. Render Target: Andromeda Galaxy (M31) Spiral
      const andromedaCenter = project(-600, -80, 900, cx, cy);
      if (andromedaCenter) {
        // Draw galactic haze / core glow
        const coreR = 75 * andromedaCenter.scale;
        const coreGrad = ctx.createRadialGradient(
          andromedaCenter.sx, andromedaCenter.sy, 0,
          andromedaCenter.sx, andromedaCenter.sy, coreR
        );
        coreGrad.addColorStop(0, "rgba(255, 255, 255, 0.75)");
        coreGrad.addColorStop(0.25, "rgba(220, 235, 255, 0.45)");
        coreGrad.addColorStop(0.65, "rgba(180, 205, 240, 0.12)");
        coreGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

        ctx.beginPath();
        ctx.arc(andromedaCenter.sx, andromedaCenter.sy, coreR, 0, Math.PI * 2);
        ctx.fillStyle = coreGrad;
        ctx.fill();

        // Draw individual spiral arm particles
        for (let i = 0; i < andromedaStars.length; i++) {
          const as = andromedaStars[i];
          const p = project(as.x, as.y, as.z, cx, cy);
          if (!p) continue;

          ctx.beginPath();
          ctx.arc(p.sx, p.sy, Math.max(0.8, as.size * p.scale), 0, Math.PI * 2);
          ctx.fillStyle = as.isCore ? "rgba(255, 255, 255, 0.85)" : `rgba(210, 228, 255, ${as.alpha})`;
          ctx.fill();
        }

        // Andromeda Label
        if (zoomLevel > 1.2) {
          ctx.font = '11px "Space Mono", monospace';
          ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
          ctx.fillText("M31 • Andromeda Core", andromedaCenter.sx + 40 * andromedaCenter.scale, andromedaCenter.sy - 20 * andromedaCenter.scale);
        }
      }

      // 3. Render Target: The Big Dipper (Ursa Major) from reference.jpg
      const projectedDipper = dipperStars.map(ds => project(ds.x, ds.y, ds.z, cx, cy));

      // Draw Constellation Connecting Lines
      dipperLines.forEach(([idxA, idxB]) => {
        const pA = projectedDipper[idxA];
        const pB = projectedDipper[idxB];
        if (!pA || !pB) return;

        const isPointerLine = (idxA === 4 && idxB === 7) || (idxA === 5 && idxB === 4);

        ctx.beginPath();
        ctx.moveTo(pA.sx, pA.sy);
        ctx.lineTo(pB.sx, pB.sy);
        ctx.strokeStyle = isPointerLine ? "rgba(255, 255, 255, 0.45)" : "rgba(255, 255, 255, 0.28)";
        ctx.lineWidth = isPointerLine ? 1.5 : 1.2;
        if (isPointerLine && idxB === 7) {
          ctx.setLineDash([4, 6]); // Dashed pointer line to Polaris!
        } else {
          ctx.setLineDash([]);
        }
        ctx.stroke();
        ctx.setLineDash([]); // Reset
      });

      // Draw 5-Pointed Stars (Ursa Major)
      projectedDipper.forEach((p, idx) => {
        if (!p) return;
        const ds = dipperStars[idx];
        const r = ds.size * p.scale;

        // Halo
        const halo = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r * 3.5);
        halo.addColorStop(0, "rgba(255, 255, 255, 0.8)");
        halo.addColorStop(0.4, "rgba(255, 255, 255, 0.15)");
        halo.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r * 3.5, 0, Math.PI * 2);
        ctx.fillStyle = halo;
        ctx.fill();

        // 5-Pointed Star Core (Authentic to reference.jpg)
        drawStar(ctx, p.sx, p.sy, 5, r * 1.6, r * 0.75, "#ffffff");

        // Star Name Label
        if (zoomLevel > 0.8) {
          ctx.font = '10px "Space Mono", monospace';
          ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
          ctx.fillText(ds.name, p.sx + r + 6, p.sy + 3);
        }
      });
    }

    animate();
  </script>
</body>
